[sssd]
services = nss, pam
domains = empresa.local
config_file_version = 2

[domain/empresa.local]
id_provider = ldap
auth_provider = ldap
ldap_uri = ldap://openldap:389
ldap_search_base = dc=empresa,dc=local
ldap_default_bind_dn = cn=admin,dc=empresa,dc=local
ldap_default_authtok = changeme
ldap_schema = rfc2307
ldap_id_use_start_tls = False
ldap_tls_reqcert = never
# Laboratorio sin TLS/LDAPS: sin esto, SSSD fuerza STARTTLS en el bind de
# autenticación y falla ("TLS connection was non-properly terminated") aunque
# ldap_id_use_start_tls ya esté en False (ese solo cubre las consultas de
# identidad, no el bind de auth). No usar en producción.
ldap_auth_disable_tls_never_use_in_production = true
cache_credentials = False
enumerate = True
